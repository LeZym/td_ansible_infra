---
- name: Configuration du routeur CSR1000
  hosts: routeurs
  gather_facts: false

  tasks:
    - name: Configuration interface GigabitEthernet1 DHCP
      cisco.ios.ios_config:
        lines:
          - ip address dhcp
          - description WAN
          - no shutdown
        parents: interface GigabitEthernet1

    - name: Configuration interface GigabitEthernet2
      cisco.ios.ios_config:
        lines:
          - ip address 192.168.2.1 255.255.255.0
          - description LAN_ENTREPRISE
          - no shutdown
        parents: interface GigabitEthernet2

    - name: Configuration interface GigabitEthernet3
      cisco.ios.ios_config:
        lines:
          - ip address 192.168.3.1 255.255.255.0
          - description LAN_DMZ
          - no shutdown
        parents: interface GigabitEthernet3

    - name: Configuration interface GigabitEthernet4
      cisco.ios.ios_config:
        lines:
          - ip address 192.168.4.1 255.255.255.0
          - description LAN_ADMIN
          - no shutdown
        parents: interface GigabitEthernet4

    - name: Suppression du pool DHCP existant
      cisco.ios.ios_config:
        lines:
          - no ip dhcp pool LAN_ENTREPRISE

    - name: Configuration du serveur DHCP
      cisco.ios.ios_config:
        lines:
          - network 192.168.2.0 255.255.255.0
          - default-router 192.168.2.1
          - dns-server 8.8.8.8
        parents: ip dhcp pool LAN_ENTREPRISE

    - name: ip nat outside sur GigabitEthernet1
      cisco.ios.ios_config:
        lines:
          - ip nat outside
        parents: interface GigabitEthernet1

    - name: ip nat inside sur GigabitEthernet2, 3 et 4
      cisco.ios.ios_config:
        lines:
          - ip nat inside
        parents: "interface {{ item }}"
      loop:
        - GigabitEthernet2
        - GigabitEthernet3
        - GigabitEthernet4

    - name: ACL pour le NAT
      cisco.ios.ios_config:
        lines:
          - access-list 1 permit 192.168.2.0 0.0.0.255
          - access-list 1 permit 192.168.3.0 0.0.0.255
          - access-list 1 permit 192.168.4.0 0.0.0.255

    - name: Activation du PAT dynamique
      cisco.ios.ios_config:
        lines:
          - ip nat inside source list 1 interface GigabitEthernet1 overload

    - name: PAT port 80 vers serveur web
      cisco.ios.ios_config:
        lines:
          - ip nat inside source static tcp 192.168.3.2 80 interface GigabitEthernet1 80

    - name: PAT port 2222 vers serveur SSH
      cisco.ios.ios_config:
        lines:
          - ip nat inside source static tcp 192.168.4.2 22 interface GigabitEthernet1 2222
